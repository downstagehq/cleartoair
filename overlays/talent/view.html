<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clear to Air · Talent OBS Feed</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: transparent;
    }
    #status-offline {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.4);
      font-family: -apple-system, sans-serif;
      font-size: 14px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: rgba(10, 15, 25, 0.4);
      border: 1px dashed rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <video id="remote-video" autoplay playsinline></video>
  <div id="status-offline">Waiting for Talent Stream...</div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slot = params.get('slot') || 'caster1';
    const signalingHost = window.location.host || '127.0.0.1:7700';
    const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    
    const remoteVideo = document.getElementById('remote-video');
    const statusOverlay = document.getElementById('status-offline');

    let pc = null;
    let ws = null;

    function initWebRTC() {
      pc = new RTCPeerConnection({
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' }
        ]
      });

      pc.ontrack = (event) => {
        console.log('[TALENT-VIEW] Received remote track:', event.track.kind);
        if (event.streams && event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
          statusOverlay.style.display = 'none';
        }
      };

      pc.onicecandidate = (event) => {
        if (event.candidate && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'candidate', candidate: event.candidate }));
        }
      };
    }

    function connectSignaling() {
      ws = new WebSocket(`${wsProto}//${signalingHost}/talent/signaling?role=obs_receiver&slot=${slot}`);

      ws.onopen = () => {
        console.log('[TALENT-VIEW] Signaling channel connected');
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'TALENT_ONLINE') {
          console.log('[TALENT-VIEW] Talent online, resetting peer connection...');
          initWebRTC();
        } else if (msg.type === 'TALENT_OFFLINE') {
          console.log('[TALENT-VIEW] Talent offline');
          statusOverlay.style.display = 'flex';
          remoteVideo.srcObject = null;
        } else if (msg.type === 'offer') {
          if (!pc) initWebRTC();
          await pc.setRemoteDescription(new RTCSessionDescription(msg.offer));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          ws.send(JSON.stringify({ type: 'answer', answer }));
        } else if (msg.type === 'candidate' && pc) {
          await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
        }
      };

      ws.onclose = () => {
        setTimeout(connectSignaling, 3000);
      };
    }

    connectSignaling();
  </script>
</body>
</html>
