name = "cleartoair-site"
main = "worker.js"
compatibility_date = "2026-10-01"

# cleartoair.com (bought 9 Oct 2026, zone on Cloudflare). Wrangler creates the DNS records
# for these custom domains; any existing A/AAAA/CNAME on the same names must be deleted first.
routes = [
  { pattern = "cleartoair.com", custom_domain = true },
  { pattern = "www.cleartoair.com", custom_domain = true }
]

[assets]
directory = "./"
binding = "ASSETS"
not_found_handling = "404-page"
# Every request passes the script first: the www -> apex redirect has to see "/" too.
# It hands everything except /api/early-access straight to the static files.
run_worker_first = true

# EA_WEBHOOK_URL (optional) is a secret: npx wrangler secret put EA_WEBHOOK_URL
# The legacy Vercel deployment (cleartoair.vercel.app) is separate and untouched:
# installs up to 0.3.0 still read its /releases/latest.json.
